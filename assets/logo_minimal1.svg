<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nexGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container (Subtle) -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Minimalist 'N' + Graduation Cap Icon -->
  <g filter="url(#glow)">
    <!-- Left Vertical Bar of N -->
    <rect x="25" y="32" width="10" height="38" rx="5" fill="url(#nexGrad1)" />
    
    <!-- Right Vertical Bar of N -->
    <rect x="65" y="32" width="10" height="38" rx="5" fill="url(#nexGrad1)" />

    <!-- Diagonal Bridge of N -->
    <path d="M30 35 L70 65" stroke="url(#nexGrad1)" stroke-width="10" stroke-linecap="round" />

    <!-- Minimalist Cap Top Diamond -->
    <polygon points="50,16 75,27 50,38 25,27" fill="url(#nexGrad1)" />
    
    <!-- Cap Tassel Dot -->
    <circle cx="75" cy="34" r="3.5" fill="#06b6d4" />
  </g>
</svg>
