<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Cyan to Magenta Vibrant Gradient -->
    <linearGradient id="b2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="b2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Glass Container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <g filter="url(#b2Glow)">
    <!-- Mortarboard Cap Top -->
    <polygon points="50,16 80,30 50,44 20,30" fill="url(#b2Grad)" opacity="0.95" />

    <!-- Tassel -->
    <path d="M80 30 v14" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="80" cy="46" r="3" fill="#ec4899" />

    <!-- Clean Integrated Grade Arrow Bar Chart Base -->
    <rect x="26" y="58" width="8" height="20" rx="4" fill="url(#b2Grad)" opacity="0.7" />
    <rect x="42" y="52" width="8" height="26" rx="4" fill="url(#b2Grad)" opacity="0.85" />
    <rect x="58" y="44" width="8" height="34" rx="4" fill="url(#b2Grad)" opacity="1" />

    <!-- Upward Trend Line Overlay -->
    <path d="M22 68 L46 54 L62 58 L78 38" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="70,38 78,38 78,46" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
