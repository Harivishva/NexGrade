<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="nexGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="tasselGradFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(50, 10)">
    <g filter="url(#fullGlow)">
      <!-- Mortarboard Cap Diamond Top -->
      <path d="M48 10 L88 24 L48 38 L16 24 Z" fill="none" stroke="url(#nexGradFull)" stroke-width="4.5" stroke-linejoin="round" />
      <path d="M48 10 L88 24 L48 38 L16 24 Z" fill="url(#nexGradFull)" opacity="0.15" />

      <!-- Skull Cap Underside Arch -->
      <path d="M28 29.5 V39.5 C28 44.5 37 48.5 48 48.5 C50.5 48.5 53 48.2 55.3 47.7" fill="none" stroke="url(#nexGradFull)" stroke-width="3.5" stroke-linecap="round" />

      <!-- Tassel Drop -->
      <path d="M22 26 V42" stroke="url(#tasselGradFull)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M22 42 C19 45 18 48 19 51.5 C20 54 22 55 22 55 C22 55 24 54 25 51.5 C26 48 25 45 22 42 Z" fill="url(#tasselGradFull)" />

      <!-- Checkmark Ribbon -->
      <path d="M34 52 C38 65 44 76 48 76 C52 76 65 52 86 27 C70 41 55 54 48 60 C43 55 38 52 34 52 Z" fill="url(#nexGradFull)" />
    </g>
  </g>

  <!-- Clean NexGrade Typography -->
  <text x="100" y="135" text-anchor="middle" font-family="'Bricolage Grotesque', 'Montserrat', sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="0.5">NexGrade</text>
</svg>
