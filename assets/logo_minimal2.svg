<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nexGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="rgba(18, 24, 43, 0.8)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Clean Vector Cap & Grade Arrow Symbol -->
  <!-- Mortarboard Cap Diamond Top -->
  <polygon points="50,22 80,34 50,46 20,34" fill="url(#nexGrad2)" />

  <!-- Cap Base Arch -->
  <path d="M30 43 v10 c0 6 9 11 20 11 s20 -5 20 -11 v-10" fill="none" stroke="url(#nexGrad2)" stroke-width="4" stroke-linecap="round" />

  <!-- Tassel Ribbon & Grade Upward Star -->
  <path d="M80 34 v18" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  <circle cx="80" cy="54" r="3.5" fill="#a855f7" />

  <!-- Upward Trend Arrow Accent (Bottom Left) -->
  <path d="M26 74 L42 58 L54 66 L74 48" fill="none" stroke="url(#nexGrad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="64,48 74,48 74,58" fill="none" stroke="url(#nexGrad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
