<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Violet to Cyan Gradient -->
    <linearGradient id="b1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Inner Glow Filter -->
    <filter id="b1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Glass Container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />

  <g filter="url(#b1Glow)">
    <!-- Mortarboard Cap Diamond Top -->
    <polygon points="50,18 82,32 50,46 18,32" fill="url(#b1Grad)" opacity="0.95" />

    <!-- Skull Cap Arch Underneath -->
    <path d="M30 38 v9 c0 5.5 9 10 20 10 s20 -4.5 20 -10 v-9" fill="none" stroke="url(#b1Grad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Hanging Tassel Ribbon & Accent Sphere -->
    <path d="M82 32 v16" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="82" cy="50" r="3" fill="#38bdf8" />

    <!-- Upward Academic Trend Path (Rising Grade Line) -->
    <path d="M22 74 L38 60 L50 68 L72 44" fill="none" stroke="url(#b1Grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4-Point Academic Excellence Star at Top Right -->
    <path d="M72 44 Q72 38 66 38 Q72 38 72 32 Q72 38 78 38 Q72 38 72 44 Z" fill="#38bdf8" />
  </g>
</svg>
